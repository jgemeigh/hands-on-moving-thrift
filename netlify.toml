[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://formsubmit.co https://fcgvrrrxzcqqzrqmwvmk.supabase.co wss://fcgvrrrxzcqqzrqmwvmk.supabase.co; img-src 'self' data: blob: https://fcgvrrrxzcqqzrqmwvmk.supabase.co; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://formsubmit.co"
